
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Book - Library Management System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #1f2937;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 650px;

            margin: 70px auto;

            padding: 0 20px;
        }

        /* =========================
           DELETE CARD
        ========================= */

        .delete-card {
            background: white;

            padding: 40px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .delete-icon {
            font-size: 55px;

            margin-bottom: 20px;
        }

        .delete-card h1 {
            color: #111827;

            font-size: 28px;

            margin-bottom: 12px;
        }

        .delete-card p {
            color: #6b7280;

            line-height: 1.6;

            margin-bottom: 10px;
        }

        .book-name {
            color: #111827;

            font-weight: bold;

            font-size: 18px;

            margin: 20px 0;
        }

        /* =========================
           WARNING
        ========================= */

        .warning-box {
            background: #fef2f2;

            border-left: 4px solid #dc2626;

            padding: 15px;

            margin: 25px 0;

            text-align: left;

            color: #991b1b;

            font-size: 14px;

            line-height: 1.6;

            border-radius: 6px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 25px;
        }

        .btn {
            padding: 12px 22px;

            border-radius: 7px;

            border: none;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .delete-btn {
            background: #dc2626;

            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            background: #e5e7eb;

            color: #374151;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }

            .delete-card {
                padding: 30px 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>

<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">

        <h2>
            📚 Library Management System
        </h2>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Dashboard
            </a>

            <a href="{% url 'books' %}">
                Books
            </a>

            <a href="{% url 'members' %}">
                Members
            </a>

            <a href="{% url 'issued_books' %}">
                Issued Books
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        </div>

    </div>


    <!-- =========================
         DELETE CONTENT
    ========================= -->

    <div class="container">

        <div class="delete-card">

            <div class="delete-icon">
                ⚠️
            </div>


            <h1>
                Delete Book?
            </h1>


            <p>
                Are you sure you want to delete this book?
            </p>


            <div class="book-name">
                "{{ book.title }}"
            </div>


            <div class="warning-box">

                <strong>Warning:</strong>

                This action cannot be undone.

                The book and its information will be
                permanently removed from the library system.

            </div>


            <!-- =========================
                 DELETE FORM
            ========================= -->

            <form method="POST">

                {% csrf_token %}

                <div class="actions">

                    <button
                        type="submit"
                        class="btn delete-btn"
                    >
                        🗑 Delete Book
                    </button>


                    <a
                        href="{% url 'books' %}"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
