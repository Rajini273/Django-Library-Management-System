<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Admin Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 430px;
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            color: #1f2937;
            font-size: 26px;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .security-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;

            color: #1e40af;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .create-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .create-btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #2563eb;
            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 7px;

            background: #fee2e2;
            color: #991b1b;

            font-size: 13px;
            margin-bottom: 8px;
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <h1>Create Admin Account</h1>

            <p>
                Register a new administrator for the library
            </p>

        </div>


        <!-- SECURITY INFORMATION -->

        <div class="security-box">

            🔐 <strong>Institute Verification Required</strong>

            <br>

            Enter the secret Institute Admin Code provided
            by the institute.

        </div>


        <!-- MESSAGES -->

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- ADMIN REGISTRATION FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <!-- INSTITUTE ADMIN CODE -->

            <div class="form-group">

                <label for="admin_code">
                    Institute Admin Code
                </label>

                <input
                    type="password"
                    id="admin_code"
                    name="admin_code"
                    placeholder="Enter institute admin code"
                    required
                >

            </div>


            <!-- CREATE BUTTON -->

            <button
                type="submit"
                class="create-btn"
            >
                Create Admin Account
            </button>

        </form>


        <!-- BACK TO LOGIN -->

        <a
            href="{% url 'admin_login' %}"
            class="back-link"
        >
            ← Back to Admin Login
        </a>

    </div>

</body>

</html>
