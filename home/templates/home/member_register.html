<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Member Registration</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #dbeafe);
    }

    .register-container {
        width: 450px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #1e3a8a;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
    }

    .register-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .register-btn:hover {
        background: #1d4ed8;
    }

    .messages {
        margin-bottom: 15px;
    }

    .message {
        padding: 10px;
        border-radius: 6px;
        background: #fee2e2;
        color: #b91c1c;
        margin-bottom: 8px;
        text-align: center;
    }

    .login-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #2563eb;
        text-decoration: none;
    }

    .login-link:hover {
        text-decoration: underline;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 12px;
        color: #555;
        text-decoration: none;
    }

    .back:hover {
        text-decoration: underline;
    }

</style>
```

</head>

<body>

```
<div class="register-container">

    <h1>Member Registration</h1>

    <p class="subtitle">
        Create your library member account
    </p>


    {% if messages %}

    <div class="messages">

        {% for message in messages %}

        <div class="message">
            {{ message }}
        </div>

        {% endfor %}

    </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

        </div>


        <div class="form-group">

            <label>Membership ID</label>

            <input
                type="text"
                name="membership_id"
                placeholder="Example: LIB001"
                required
            >

        </div>


        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Create a username"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

        </div>


        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

        </div>


        <button
            type="submit"
            class="register-btn"
        >
            Register
        </button>

    </form>


    <a
        href="{% url 'member_login' %}"
        class="login-link"
    >
        Already have an account? Member Login
    </a>


    <a
        href="{% url 'login' %}"
        class="back"
    >
        ← Back to Login Options
    </a>

</div>
```

</body>

</html>
