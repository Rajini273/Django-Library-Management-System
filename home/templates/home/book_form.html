<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book - Library Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                📚 Library Management System
            </a>

            <a href="/books/" class="btn btn-outline-light">
                Back to Books
            </a>

        </div>
    </nav>


    <!-- Add Book Form -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow">

                    <div class="card-body p-5">

                        <h2 class="text-center mb-4">
                            ➕ Add New Book
                        </h2>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">
                                    Book Title
                                </label>

                                <input type="text"
                                       name="title"
                                       class="form-control"
                                       placeholder="Enter book title"
                                       required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">
                                    Author
                                </label>

                                <input type="text"
                                       name="author"
                                       class="form-control"
                                       placeholder="Enter author name"
                                       required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">
                                    Category
                                </label>

                                <input type="text"
                                       name="category"
                                       class="form-control"
                                       placeholder="Enter category"
                                       required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">
                                    ISBN
                                </label>

                                <input type="text"
                                       name="isbn"
                                       class="form-control"
                                       placeholder="Enter ISBN"
                                       required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">
                                    Quantity
                                </label>

                                <input type="number"
                                       name="quantity"
                                       class="form-control"
                                       min="1"
                                       required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">
                                    Published Date
                                </label>

                                <input type="date"
                                       name="published_date"
                                       class="form-control">
                            </div>


                            <div class="d-grid mt-4">

                                <button type="submit"
                                        class="btn btn-primary btn-lg">
                                    Add Book
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
