{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        /* LIBRARY BACKGROUND IMAGE */
        background-image:
            linear-gradient(
                rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.45)
            ),
            url("{% static 'home/images/library-bg.png' %}");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .login-container {

        width: 420px;

        background: rgba(255, 255, 255, 0.96);

        padding: 35px;

        border-radius: 15px;

        box-shadow:
            0 8px 25px
            rgba(0, 0, 0, 0.25);
    }

    h1 {

        text-align: center;

        margin-bottom: 8px;

        color: #1e3a8a;
    }

    .subtitle {

        text-align: center;

        color: #666;

        margin-bottom: 25px;
    }

    .form-group {

        margin-bottom: 20px;
    }

    label {

        display: block;

        margin-bottom: 7px;

        font-weight: bold;

        color: #333;
    }

    input {

        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 7px;

        font-size: 15px;
    }

    input:focus {

        outline: none;

        border-color: #2563eb;
    }

    .login-btn {

        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 7px;

        background: #2563eb;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        margin-top: 5px;
    }

    .login-btn:hover {

        background: #1d4ed8;
    }

    .messages {

        margin-bottom: 15px;
    }

    .message {

        padding: 10px;

        border-radius: 6px;

        background: #fee2e2;

        color: #b91c1c;

        margin-bottom: 8px;

        text-align: center;
    }

    .register-link {

        display: block;

        text-align: center;

        margin-top: 20px;

        color: #2563eb;

        text-decoration: none;

        font-weight: bold;
    }

    .register-link:hover {

        text-decoration: underline;
    }

    .back {

        display: block;

        text-align: center;

        margin-top: 15px;

        color: #555;

        text-decoration: none;
    }

    .back:hover {

        text-decoration: underline;
    }

</style>

</head>

<body>

<div class="login-container">


<h1>Member Login</h1>

<p class="subtitle">
    Login to your library account
</p>

{% if messages %}

<div class="messages">

    {% for message in messages %}

    <div class="message">

        {{ message }}

    </div>

    {% endfor %}

</div>

{% endif %}

<form method="POST">

    {% csrf_token %}

    <div class="form-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

    </div>

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

    </div>

    <button
        type="submit"
        class="login-btn"
    >
        Member Login
    </button>

</form>

<a
    href="{% url 'member_register' %}"
    class="register-link"
>
    New member? Create an account
</a>

<a
    href="{% url 'login' %}"
    class="back"
>
    ← Back to Login Options
</a>

</div>

</body>

</html>
